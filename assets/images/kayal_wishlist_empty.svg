<svg xmlns="http://www.w3.org/2000/svg" width="512" height="640" viewBox="0 0 512 640" fill="none">
  <title>Empty wishlist illustration</title>
  <desc>A clipboard with heart-shaped wishlist items, green leaves, and a coral heart on a transparent background.</desc>
  <defs>
    <linearGradient id="mint" x1="104" y1="180" x2="399" y2="404" gradientUnits="userSpaceOnUse"><stop stop-color="#DFF4EA"/><stop offset="1" stop-color="#C7EBDD"/></linearGradient>
    <linearGradient id="paper" x1="159" y1="165" x2="340" y2="453" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFEFC"/><stop offset="1" stop-color="#F8F5F0"/></linearGradient>
    <linearGradient id="green" x1="96" y1="329" x2="177" y2="463" gradientUnits="userSpaceOnUse"><stop stop-color="#359A79"/><stop offset="1" stop-color="#16785E"/></linearGradient>
    <linearGradient id="clip" x1="217" y1="95" x2="286" y2="151" gradientUnits="userSpaceOnUse"><stop stop-color="#258665"/><stop offset="1" stop-color="#176B53"/></linearGradient>
    <linearGradient id="coral" x1="343" y1="365" x2="410" y2="468" gradientUnits="userSpaceOnUse"><stop stop-color="#FF7658"/><stop offset="1" stop-color="#F0442C"/></linearGradient>
    <linearGradient id="line" x1="230" y1="204" x2="320" y2="211" gradientUnits="userSpaceOnUse"><stop stop-color="#B6C3D0"/><stop offset="1" stop-color="#A6B5C5"/></linearGradient>
  </defs>
  <!-- soft organic backdrop -->
