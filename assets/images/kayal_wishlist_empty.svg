  <path d="M169 459C138 446 111 437 84 416C115 405 144 420 169 459Z" fill="#2E9675"/>
  <path d="M170 460C151 426 136 396 126 370" stroke="#176F58" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  <!-- clipboard paper -->
  <path d="M163 187L322 169C334 168 344 176 346 189L375 432C377 445 369 454 357 456L179 474C167 475 158 467 157 455L137 211C136 199 149 189 163 187Z" fill="#9AD9C4" opacity=".45"/>
  <path d="M153 190L311 173C324 172 334 180 336 193L363 428C365 440 357 449 345 451L176 466C164 467 155 459 154 447L132 214C131 202 140 192 153 190Z" fill="url(#paper)"/>
