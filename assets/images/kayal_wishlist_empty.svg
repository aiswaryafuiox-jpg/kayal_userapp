  <circle cx="245" cy="134" r="8" fill="#F9FBF9"/>
  <!-- wishlist rows -->
  <g stroke="#8C9BAB" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M163 229C155 220 143 226 146 237C148 245 163 255 163 255S179 243 179 235C179 224 168 221 163 229Z"/>
    <path d="M195 225L273 217M197 241L244 236" stroke="url(#line)" stroke-width="6"/>
    <path d="M168 294C160 285 148 291 151 302C153 310 168 320 168 320S184 308 184 300C184 289 173 286 168 294Z"/>
    <path d="M202 290L282 282M204 306L252 301" stroke="url(#line)" stroke-width="6"/>
    <path d="M173 359C165 350 153 356 156 367C158 375 173 385 173 385S189 373 189 365C189 354 178 351 173 359Z"/>
    <path d="M207 355L267 349M209 371L248 367" stroke="url(#line)" stroke-width="6"/>
  </g>
  <!-- ground shadow -->
  <ellipse cx="256" cy="474" rx="183" ry="15" fill="#D7E4E8" opacity=".8"/>
  <!-- prominent heart -->
  <path d="M352 467C338 454 316 440 317 416C318 395 334 383 351 387C364 390 372 401 376 411C385 396 399 389 413 395C432 403 436 425 425 444C414 463 390 480 379 489C372 494 364 487 352 467Z" fill="#F24A32" opacity=".18"/>
  <path d="M355 461C341 449 324 432 325 412C326 394 340 383 355 388C367 392 374 403 377 412C386 398 399 392 412 398C430 406 433 426 423 444C412 463 391 478 380 487C373 492 366 482 355 461Z" fill="url(#coral)"/>
  <path d="M342 411C345 402 352 399 359 398" stroke="#FF9A7C" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <path d="M425 382L430 368M448 395L460 386M439 414L452 414" stroke="#F45B3D" stroke-width="5" stroke-linecap="round"/>
  <!-- caption -->
  <text x="256" y="548" text-anchor="middle" fill="#526579" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">Your wishlist is empty</text>
